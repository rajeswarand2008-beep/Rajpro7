<!DOCTYPE html>
<html>

    <title>Ordered and Unordered Lists</title>

<body>

    <h1>HTML Lists</h1>

    <h2>Ordered List</h2>
    <p>Steps to Create a Web Page:</p>

    <ol>
        <li>Open a text editor</li>
        <li>Write HTML code</li>
        <li>Save the file</li>
        <li>Open the file in a browser</li>
    </ol>

    <h2>Unordered List</h2>
    <p>Web Technologies:</p>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Bootstrap</li>
    </ul>

</body>
</html>
